name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: ['main', 'feature/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'feature/mvp' || github.ref }}

      - name: Use Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund

      - name: Validate Expo dependency versions
        id: expo_check
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx expo install --check

      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Deterministic engine tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm test

      - name: Validate Metro production bundle
        id: export
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run export:android

      - name: Publish validation status
        if: always()
        uses: actions/github-script@v7
        env:
          INSTALL: ${{ steps.install.outcome }}
          EXPO_CHECK: ${{ steps.expo_check.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          EXPORT: ${{ steps.export.outcome }}
        with:
          script: |
            const { execSync } = require('node:child_process');
            const sha = execSync('git rev-parse HEAD').toString().trim();
            const outcomes = {
              install: process.env.INSTALL,
              expo: process.env.EXPO_CHECK,
              typecheck: process.env.TYPECHECK,
              tests: process.env.TESTS,
              export: process.env.EXPORT,
            };
            const failed = Object.entries(outcomes)
              .filter(([, value]) => value !== 'success')
              .map(([name]) => name);
            const passed = failed.length === 0;
            const suffix = passed ? 'passed' : failed.join('-');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: passed ? 'success' : 'failure',
              context: `number-nova/ci/${suffix}`,
              description: passed ? 'MVP validation passed' : `Failed: ${failed.join(', ')}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Fail workflow when validation failed
        if: always() && (steps.install.outcome != 'success' || steps.expo_check.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.tests.outcome != 'success' || steps.export.outcome != 'success')
        run: exit 1
