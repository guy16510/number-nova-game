name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: ['main', 'feature/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'feature/mvp' || github.ref }}

      - name: Use Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo dependency versions
        run: npx expo install --check

      - name: Typecheck
        run: npm run typecheck

      - name: Deterministic engine tests
        run: npm test

      - name: Validate Metro production bundle
        run: npm run export:android

      - name: Publish validation status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('node:child_process');
            const sha = execSync('git rev-parse HEAD').toString().trim();
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: passed ? 'success' : 'failure',
              context: 'number-nova/ci',
              description: passed ? 'MVP validation passed' : 'MVP validation failed',
            });
