name: Render Smoke

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'src/**'
      - 'e2e/**'
      - 'scripts/run-render-smoke.sh'
      - 'scripts/validate-render.py'
      - '.github/workflows/render-smoke.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'src/**'
      - 'e2e/**'
      - 'scripts/run-render-smoke.sh'
      - 'scripts/validate-render.py'
      - '.github/workflows/render-smoke.yml'
  schedule:
    - cron: '41 7 * * 2'

permissions:
  contents: read

concurrency:
  group: render-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-render-smoke:
    name: Android emulator render smoke
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo SDK 54 dependencies
        run: npx expo install --check

      - name: Run deterministic simulation suite
        run: npm run validate

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build standalone x86_64 release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=x86_64

      - name: Locate release APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install screenshot analysis dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, drive app, and validate rendered frames
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/run-render-smoke.sh

      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: number-nova-render-smoke-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/**
            android/app/build/outputs/apk/release/*.apk
