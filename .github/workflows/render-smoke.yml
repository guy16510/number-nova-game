name: Render Smoke

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'src/**'
      - 'e2e/**'
      - 'scripts/run-render-smoke.sh'
      - 'scripts/validate-render.py'
      - '.github/workflows/render-smoke.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'src/**'
      - 'e2e/**'
      - 'scripts/run-render-smoke.sh'
      - 'scripts/validate-render.py'
      - '.github/workflows/render-smoke.yml'
  schedule:
    - cron: '41 7 * * 2'

permissions:
  contents: read
  statuses: write

concurrency:
  group: render-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-render-smoke:
    name: Android emulator render smoke
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish pending render status
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('node:child_process');
            const sha = execSync('git rev-parse HEAD').toString().trim();
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'pending',
              context: 'number-nova/render-smoke',
              description: 'Building APK and starting emulator render validation',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Use Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund

      - name: Validate Expo SDK 54 dependencies
        id: expo_check
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npx expo install --check

      - name: Run deterministic simulation suite
        id: simulations
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run validate

      - name: Generate native Android project
        id: prebuild
        if: steps.install.outcome == 'success' && steps.expo_check.outcome == 'success' && steps.simulations.outcome == 'success'
        continue-on-error: true
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Build standalone x86_64 release APK
        id: build_apk
        if: steps.prebuild.outcome == 'success'
        continue-on-error: true
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=x86_64

      - name: Locate release APK
        id: locate_apk
        if: steps.build_apk.outcome == 'success'
        continue-on-error: true
        run: |
          APK=$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Install Maestro
        id: maestro
        if: steps.locate_apk.outcome == 'success'
        continue-on-error: true
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install screenshot analysis dependency
        id: pillow
        if: steps.locate_apk.outcome == 'success'
        continue-on-error: true
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Enable KVM
        id: kvm
        if: steps.locate_apk.outcome == 'success'
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, drive app, and validate rendered frames
        id: render
        if: steps.locate_apk.outcome == 'success' && steps.maestro.outcome == 'success' && steps.pillow.outcome == 'success' && steps.kvm.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/run-render-smoke.sh

      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: number-nova-render-smoke-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/**
            android/app/build/outputs/apk/release/*.apk

      - name: Publish render validation status
        if: always()
        uses: actions/github-script@v7
        env:
          INSTALL: ${{ steps.install.outcome }}
          EXPO_CHECK: ${{ steps.expo_check.outcome }}
          SIMULATIONS: ${{ steps.simulations.outcome }}
          PREBUILD: ${{ steps.prebuild.outcome }}
          BUILD_APK: ${{ steps.build_apk.outcome }}
          LOCATE_APK: ${{ steps.locate_apk.outcome }}
          MAESTRO: ${{ steps.maestro.outcome }}
          PILLOW: ${{ steps.pillow.outcome }}
          KVM: ${{ steps.kvm.outcome }}
          RENDER: ${{ steps.render.outcome }}
        with:
          script: |
            const { execSync } = require('node:child_process');
            const sha = execSync('git rev-parse HEAD').toString().trim();
            const outcomes = {
              install: process.env.INSTALL,
              expo: process.env.EXPO_CHECK,
              simulations: process.env.SIMULATIONS,
              prebuild: process.env.PREBUILD,
              apk: process.env.BUILD_APK,
              locate: process.env.LOCATE_APK,
              maestro: process.env.MAESTRO,
              pillow: process.env.PILLOW,
              kvm: process.env.KVM,
              render: process.env.RENDER,
            };
            const failed = Object.entries(outcomes)
              .filter(([, value]) => value !== 'success')
              .map(([name]) => name);
            const passed = failed.length === 0;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: passed ? 'success' : 'failure',
              context: 'number-nova/render-smoke',
              description: passed ? 'Emulator rendered and passed visual checks' : `Failed: ${failed.join(', ')}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Fail workflow when render validation failed
        if: always() && (steps.install.outcome != 'success' || steps.expo_check.outcome != 'success' || steps.simulations.outcome != 'success' || steps.prebuild.outcome != 'success' || steps.build_apk.outcome != 'success' || steps.locate_apk.outcome != 'success' || steps.maestro.outcome != 'success' || steps.pillow.outcome != 'success' || steps.kvm.outcome != 'success' || steps.render.outcome != 'success')
        run: exit 1
