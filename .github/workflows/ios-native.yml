name: iOS Native Build

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'src/**'
      - 'assets/**'
      - 'scripts/verify-ios-config.mjs'
      - '.github/workflows/ios-native.yml'
  push:
    branches: ['main', 'fix/**', 'feature/**']
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'src/**'
      - 'assets/**'
      - 'scripts/verify-ios-config.mjs'
      - '.github/workflows/ios-native.yml'

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: Compile native iOS app
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20.19
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo dependencies and configuration
        run: |
          npx expo install --check
          npm run verify:ios
          npx expo config --type public --json > /tmp/number-nova-expo-config.json

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        run: npx pod-install ios

      - name: Compile for iOS Simulator without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          if [[ -z "$workspace" ]]; then
            echo 'No generated Xcode workspace found.' >&2
            exit 1
          fi
          scheme=$(xcodebuild -workspace "$workspace" -list -json | python3 -c "import json,sys; data=json.load(sys.stdin); print(data['workspace']['schemes'][0])")
          echo "Building workspace=$workspace scheme=$scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/number-nova-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Upload generated iOS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/number-nova-expo-config.json
            ios/Podfile.lock
            ios/*.xcodeproj/project.pbxproj
