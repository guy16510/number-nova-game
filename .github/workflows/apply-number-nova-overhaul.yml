name: Apply Number Nova gameplay overhaul

on:
  push:
    branches:
      - feature/alien-asteroid-ambush
    paths:
      - .overhaul/**

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/alien-asteroid-ambush
          fetch-depth: 0

      - name: Expand validated source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .overhaul/chunk1.txt .overhaul/chunk2.txt .overhaul/chunk3.txt .overhaul/chunk4.txt > /tmp/number-nova-overhaul.b64
          base64 --decode /tmp/number-nova-overhaul.b64 > /tmp/number-nova-overhaul.tar.gz
          tar -xzf /tmp/number-nova-overhaul.tar.gz -C .
          rm -rf .overhaul
          rm -f .github/workflows/apply-number-nova-overhaul.yml

      - name: Commit validated overhaul
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement immersive progressive gameplay overhaul"
          git push origin HEAD:feature/alien-asteroid-ambush
