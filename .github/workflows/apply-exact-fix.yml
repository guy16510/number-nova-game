name: Apply strict TypeScript gameplay fix

on:
  push:
    branches:
      - feature/alien-asteroid-ambush
    paths:
      - .exact-fix/**

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alien-asteroid-ambush
          fetch-depth: 0
      - name: Apply validated domain fixes
        shell: bash
        run: |
          set -euo pipefail
          cat .exact-fix/chunk1.txt .exact-fix/chunk2.txt > /tmp/exact-fix.b64
          base64 --decode /tmp/exact-fix.b64 > /tmp/exact-fix.tar.gz
          tar -xzf /tmp/exact-fix.tar.gz -C .
          rm -rf .exact-fix
          rm -f .github/workflows/apply-exact-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix strict optional gameplay contracts"
          git push origin HEAD:feature/alien-asteroid-ambush
