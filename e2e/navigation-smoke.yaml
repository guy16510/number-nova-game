appId: com.guy16510.numbernova
---
- launchApp:
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- assertVisible: "START MISSION"
- takeScreenshot: artifacts/render/nav-menu-a
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: artifacts/render/nav-menu-b
- longPressOn: "Hold for Parents"
- assertVisible: "Parent dashboard"
- assertVisible: "DONE"
- takeScreenshot: artifacts/render/nav-parents-a
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: artifacts/render/nav-parents-b
- tapOn: "DONE"
- assertVisible: "START MISSION"
- tapOn: "START MISSION"
- assertVisible: "CALIBRATE & LAUNCH"
- tapOn:
    text: "Use touch controls instead"
    waitToSettleTimeoutMs: 1000
- assertVisible: "BUBBLE SHIELD"
- assertVisible: "ROCKET BOOST"
- tapOn:
    text: "Pause"
    waitToSettleTimeoutMs: 1000
- assertVisible: "Mission paused"
- assertVisible: "RESUME"
- takeScreenshot: artifacts/render/nav-paused-a
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: artifacts/render/nav-paused-b
- tapOn:
    text: "RESUME"
    waitToSettleTimeoutMs: 1000
- assertVisible: "BUBBLE SHIELD"
- assertVisible: "ROCKET BOOST"
- takeScreenshot: artifacts/render/nav-resumed-a
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: artifacts/render/nav-resumed-b
- tapOn:
    text: "Pause"
    waitToSettleTimeoutMs: 1000
- assertVisible: "Mission paused"
- tapOn:
    text: "Exit mission"
    waitToSettleTimeoutMs: 1000
- assertVisible: "START MISSION"
- takeScreenshot: artifacts/render/nav-exited-a
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: artifacts/render/nav-exited-b
